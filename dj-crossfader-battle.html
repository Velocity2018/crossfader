<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch DJ Battle Crossfader Overlay</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/+esm"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Anton&family=Permanent+Marker&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: transparent; font-family: 'Arial Black', Impact, sans-serif; overflow: hidden; user-select: none; }
        #overlay-container { width: 100vw; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; opacity: 0; transition: opacity 1.5s ease; }
        #overlay-container.ov-active { opacity: 1; }
        .mixer-track { width: 80%; height: 34px; background: #121214; background-image: linear-gradient(45deg, #1a1a1c 25%, transparent 25%), linear-gradient(-45deg, #1a1a1c 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1c 75%), linear-gradient(-45deg, transparent 75%, #1a1a1c 75%); background-size: 8px 8px; border: 4px solid #2a2a2e; border-radius: 8px; position: relative; box-shadow: inset 0 4px 12px #000, 0 8px 20px rgba(0,0,0,0.7); display: flex; align-items: center; }
        .mixer-track::before { content: ''; position: absolute; left: 50%; top: -8px; bottom: -8px; width: 4px; background: #ffea00; z-index: 2; transform: translateX(-50%); box-shadow: 0 0 8px #ffea00; }
        .side-left { height: 100%; width: 50%; background: linear-gradient(90deg, #ff0055, #ff7700); transition: width 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .side-right { height: 100%; flex-grow: 1; background: linear-gradient(90deg, #00f0ff, #0044ff); }
        .crossfader-fader { position: absolute; top: -12px; height: 58px; width: 28px; background: linear-gradient(to right, #e6e6e6 0%, #ffffff 30%, #bbbbbb 70%, #888888 100%); border: 2px solid #111; border-radius: 4px; box-shadow: 0 6px 12px rgba(0,0,0,0.9), inset 0 1px 3px #fff; transform: translateX(-50%); z-index: 5; transition: left 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
        .crossfader-fader::before, .crossfader-fader::after { content: ''; width: 16px; height: 2px; background: #333; box-shadow: 0 1px 0px #fff; }
        .fader-center-line { width: 100%; height: 3px; background: #000; position: absolute; left: 0; }
        .danger-flash { animation: danger-pulse 0.3s infinite alternate; }
        @keyframes danger-pulse { from { border-color: #2a2a2e; box-shadow: 0 0 5px rgba(255,0,0,0); } to { border-color: #ff0055; box-shadow: 0 0 20px #ff0055; } }
        .labels { width: 80%; display: flex; justify-content: space-between; margin-bottom: 8px; text-transform: uppercase; font-size: 32px; color: #fff; text-shadow: 3px 3px 0px #000, -1px -1px 0px #000; letter-spacing: 1px; }
        .status-text { font-size: 15px; color: #ccc; margin-top: 10px; text-shadow: 2px 2px 3px #000; font-family: sans-serif; font-weight: bold; letter-spacing: 0.5px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .timer-display { color: #ffea00; font-size: 20px; }
        .win-banner { position: absolute; font-size: 42px; color: #ffea00; text-shadow: 4px 4px 0px #000, -1px -1px 0px #000; display: none; animation: dramatic-pulse 0.3s infinite alternate; z-index: 10; }
        @keyframes dramatic-pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        #control-panel {
            background: #0d0d11; color: white; padding: 25px; font-family: sans-serif; border-top: 4px solid #1a1a22; display: flex; flex-wrap: wrap; gap: 20px;
            position: absolute; top: 160px; left: 0; width: calc(100vw - 50px);
        }
        .section { background: #16161f; padding: 18px; border-radius: 8px; flex: 1; min-width: 260px; border: 1px solid #222530; }
        h4 { margin: 0 0 12px 0; color: #00f0ff; text-transform: uppercase; font-size: 13px; letter-spacing: 1px;}
        label { display: block; margin: 8px 0 3px 0; color: #aaa; font-size: 12px;}
        input, select { background: #09090c; border: 1px solid #333745; color: white; padding: 6px; border-radius: 4px; width: 92%; }
        button { padding: 8px 14px; background: #0044ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #00f0ff; color: black; box-shadow: 0 0 10px #00f0ff; }
        .color-pickers { display: flex; gap: 10px; }
        .color-pickers div { flex: 1; }
    </style>
</head>
<body>
    <div id="overlay-container">
        <div id="genre-labels" class="labels">
            <span id="lbl-left" style="color: #ff0055;">House</span>
            <span id="lbl-right" style="color: #00f0ff;">Drum & Bass</span>
        </div>
        <div id="mixer-track-bar" class="mixer-track">
            <div id="bar-left" class="side-left"></div>
            <div id="bar-right" class="side-right"></div>
            <div id="fader-knob" class="crossfader-fader" style="left: 50%;">
                <div class="fader-center-line"></div>
            </div>
        </div>
        <div id="status-line" class="status-text">🔒 Arena Locked. Goal Progress: <span style="color:#ffea00;">0</span> / 500 Bits to open voting battle!</div>
        <div id="win-banner" class="win-banner">HOUSE WINS!</div>
    </div>

    <div id="control-panel">
        <div class="section">
            <h4>📡 1. Twitch Channel Link</h4>
            <label>Twitch Username:</label>
            <input type="text" id="cfg-channel" value="velocity69dj" placeholder="yourchannelname">
            <button onclick="initTwitch()">Connect Chat</button>
            <p style="font-size:12px; margin-top:8px;">Status: <span id="conn-status" style="color:#ff0055; font-weight:bold;">Offline</span></p>
        </div>
        <div class="section">
            <h4>💿 2. Match Profiles</h4>
            <label>Left Name:</label> <input type="text" id="cfg-left-name" value="House">
            <label>Left Chat Command:</label> <input type="text" id="cfg-left-cmd" value="!house">
            <label>Right Name:</label> <input type="text" id="cfg-right-name" value="Drum & Bass">
            <label>Right Chat Command:</label> <input type="text" id="cfg-right-cmd" value="!dnb">
            <button onclick="applySetupChanges()">Save Profile Settings</button>
        </div>
        <div class="section">
            <h4>🎨 3. Visual Style Customizer</h4>
            <div class="color-pickers">
                <div><label>Left Theme Color:</label><input type="color" id="cfg-color-left" value="#ff0055" style="padding:2px; height:30px;"></div>
                <div><label>Right Theme Color:</label><input type="color" id="cfg-color-right" value="#00f0ff" style="padding:2px; height:30px;"></div>
            </div>
            <label>Display Typography Font:</label>
            <select id="cfg-font" onchange="applySetupChanges()">
                <option value="'Arial Black', Impact, sans-serif">Standard Impact</option>
                <option value="'Orbitron', sans-serif">Futuristic Sci-Fi (Orbitron)</option>
                <option value="'Anton', sans-serif">Bold Compressed (Anton)</option>
                <option value="'Permanent Marker', cursive">Street Graffiti (Marker)</option>
                <option value="'Rubik Mono One', sans-serif">Thick Block Arcade (Rubik)</option>
            </select>
            <button onclick="applySetupChanges()" style="background:#a83294;">Apply Colors & Font</button>
            <label>Fade In/Out Duration (Seconds):</label>
            <input type="number" id="cfg-fade-duration" value="1.5" step="0.1">
        </div>
        <div class="section">
            <h4>⚖️ 4. Match Rules & Physics</h4>
            <label>Match Clock Duration (Seconds):</label> <input type="number" id="cfg-duration" value="90">
            <label>Bit Goal to Auto-Trigger:</label> <input type="number" id="cfg-bit-goal" value="500">
            <label>Sub/Resub/Gift Count to Auto-Trigger:</label> <input type="number" id="cfg-sub-goal" value="5">
            <label>Fader Move Distance per vote (%):</label> <input type="number" id="cfg-power" value="1.2" step="0.1">
            <label>Gravity Return Speed (%/sec):</label> <input type="number" id="cfg-drift" value="0" step="0.1">
            <label>Fader Slide Animation (Seconds):</label> <input type="number" id="cfg-slide-duration" value="0.15" step="0.01">
        </div>
        <div class="section">
            <h4>🛠️ 5. Broadcast Sandbox Tool</h4>
            <button onclick="forceStartEvent()" style="background:#00ff66; color:black; width:100%;">⚡ Force Open Arena</button>
            <button onclick="simulateAction('left')" style="background:#ff0055; width:48%; font-size:11px;">Sim Vote Left</button>
            <button onclick="simulateAction('right')" style="background:#0044ff; width:48%; font-size:11px;">Sim Vote Right</button>
            <button onclick="addSimulatedHype(250)" style="background:#ffea00; color:black; width:100%; margin-top:5px;">Simulate +250 Goal Bits</button>
        </div>
        <div class="section">
            <h4>🗳️ 6. Genre Vote Pool</h4>
            <label>Genre Pool (comma separated):</label>
            <input type="text" id="cfg-genre-pool" value="House, Techno, Trance, Drum & Bass, Dubstep">
            <label>Poll Duration (Seconds):</label>
            <input type="number" id="cfg-poll-duration" value="20">
        </div>
    </div>
    <script>
        let position = 50, isEventActive = false, arenaArmed = false, bitHypePool = 0, subHypeCount = 0, timeLeft = 0, gameInterval = null, lastCommandTime = 0, twitchClient = null, userCooldowns = {};
        let pollActive = false, pollPool = [], pollVotes = {}, pollVoters = {}, pollTimer = null, pollTimeLeft = 0;
        const trackBar = document.getElementById('mixer-track-bar');

        window.onload = function() {
            applySetupChanges();
            initTwitch();
        };

        function applySetupChanges() {
            document.getElementById('lbl-left').innerText = document.getElementById('cfg-left-name').value;
            document.getElementById('lbl-right').innerText = document.getElementById('cfg-right-name').value;
            const leftColor = document.getElementById('cfg-color-left').value, rightColor = document.getElementById('cfg-color-right').value;
            document.getElementById('bar-left').style.background = `linear-gradient(90deg, ${leftColor}, #111)`;
            document.getElementById('bar-right').style.background = `linear-gradient(90deg, #111, ${rightColor})`;
            document.getElementById('lbl-left').style.color = leftColor; document.getElementById('lbl-right').style.color = rightColor;
            document.getElementById('overlay-container').style.fontFamily = document.getElementById('cfg-font').value;
            document.getElementById('overlay-container').style.transitionDuration = document.getElementById('cfg-fade-duration').value + 's';
            const slideDur = document.getElementById('cfg-slide-duration').value + 's';
            document.getElementById('bar-left').style.transitionDuration = slideDur;
            document.getElementById('fader-knob').style.transitionDuration = slideDur;
            resetSystem();
        }

        function resetSystem() { clearInterval(gameInterval); clearInterval(pollTimer); pollActive = false; position = 50; isEventActive = false; arenaArmed = false; bitHypePool = 0; subHypeCount = 0; userCooldowns = {}; trackBar.classList.remove('danger-flash'); updateUI(); document.getElementById('win-banner').style.display = 'none'; renderLockedStatus(); hideOverlay(); }
        function showOverlay() { document.getElementById('overlay-container').classList.add('ov-active'); }
        function hideOverlay() { document.getElementById('overlay-container').classList.remove('ov-active'); }
        function updateUI() { document.getElementById('bar-left').style.width = position + '%'; document.getElementById('fader-knob').style.left = position + '%'; if (isEventActive && (position >= 85 || position <= 15)) { trackBar.classList.add('danger-flash'); } else { trackBar.classList.remove('danger-flash'); } }
        function renderLockedStatus() { document.getElementById('status-line').innerHTML = `🔒 Arena Locked. Bits: <span style="color:#ffea00;">${bitHypePool}</span>/${document.getElementById('cfg-bit-goal').value} &nbsp;|&nbsp; Subs/Gifts: <span style="color:#ffea00;">${subHypeCount}</span>/${document.getElementById('cfg-sub-goal').value}`; }
        function renderArmedStatus() { showOverlay(); document.getElementById('status-line').innerHTML = `🎤 Goal reached! Run your poll, then type <b>!setbattle genre1 genre2</b> in chat to start the battle!`; }
        function armArena() { if (isEventActive || arenaArmed) return; arenaArmed = true; startGenrePoll(); }

        function startGenrePoll() {
            showOverlay();
            const pool = document.getElementById('cfg-genre-pool').value.split(',').map(s => s.trim()).filter(Boolean);
            if (pool.length < 2) { renderArmedStatus(); return; }
            pollPool = pool; pollVotes = {}; pollVoters = {}; pollActive = true;
            pollTimeLeft = parseInt(document.getElementById('cfg-poll-duration').value) || 20;
            updatePollStatus();
            pollTimer = setInterval(() => {
                pollTimeLeft--;
                updatePollStatus();
                if (pollTimeLeft <= 0) { clearInterval(pollTimer); finishGenrePoll(); }
            }, 1000);
        }

        function updatePollStatus() {
            const optionsText = pollPool.map(g => `<b>${g}</b>: ${pollVotes[g.toLowerCase()] || 0}`).join(' &nbsp;|&nbsp; ');
            document.getElementById('status-line').innerHTML = `🗳️ VOTE for the next battle! Type a genre name in chat! (${pollTimeLeft}s) — ${optionsText}`;
        }

        function finishGenrePoll() {
            pollActive = false;
            const ranked = [...pollPool].sort((a, b) => (pollVotes[b.toLowerCase()] || 0) - (pollVotes[a.toLowerCase()] || 0));
            const leftName = ranked[0], rightName = ranked[1];
            const leftCmd = '!' + leftName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const rightCmd = '!' + rightName.toLowerCase().replace(/[^a-z0-9]/g, '');
            document.getElementById('cfg-left-name').value = leftName;
            document.getElementById('cfg-left-cmd').value = leftCmd;
            document.getElementById('cfg-right-name').value = rightName;
            document.getElementById('cfg-right-cmd').value = rightCmd;
            applySetupChanges();
            startEvent();
        }

        function forceStartEvent() { startEvent(); }

        function startEvent() {
            if(isEventActive) return; clearInterval(pollTimer); pollActive = false; isEventActive = true; arenaArmed = false; showOverlay(); position = 50; updateUI(); document.getElementById('win-banner').style.display = 'none'; timeLeft = parseInt(document.getElementById('cfg-duration').value); lastCommandTime = Date.now();
            gameInterval = setInterval(() => {
                timeLeft--;
                if (Date.now() - lastCommandTime > 2000) {
                    const driftSpeed = parseFloat(document.getElementById('cfg-drift').value);
                    if (position > 50) position = Math.max(50, position - driftSpeed);
                    else if (position < 50) position = Math.min(50, position + driftSpeed);
                    updateUI();
                }
                document.getElementById('status-line').innerHTML = `🔥 BATTLE ACTIVE! Type <span style="font-style:italic;">${document.getElementById('cfg-left-cmd').value}</span> or <span style="font-style:italic;">${document.getElementById('cfg-right-cmd').value}</span>! Time left: <span class="timer-display">${timeLeft}s</span>`;
                if (timeLeft <= 0) determineWinner();
            }, 1000);
        }

        function shiftFader(direction) {
            if(!isEventActive) return; lastCommandTime = Date.now();
            position += (direction === 'right' ? 1 : -1) * parseFloat(document.getElementById('cfg-power').value);
            position = Math.max(0, Math.min(100, position)); updateUI();
            if(position >= 100 || position <= 0) determineWinner();
        }

        function determineWinner() {
            clearInterval(gameInterval); isEventActive = false; trackBar.classList.remove('danger-flash');
            let winner = "DRAW OVERTIME TIE!";
            if(position < 50) winner = `${document.getElementById('lbl-left').innerText} WINS!`;
            if(position > 50) winner = `${document.getElementById('lbl-right').innerText} WINS!`;
            document.getElementById('win-banner').innerText = winner; document.getElementById('win-banner').style.display = 'block';
            document.getElementById('status-line').innerText = "Arena closed. Preparing next track round setup.";
            setTimeout(() => { resetSystem(); }, 8000);
        }

        function simulateAction(dir) { if(!isEventActive) startEvent(); shiftFader(dir); }
        function addSimulatedHype(amount) { if(isEventActive || arenaArmed) return; bitHypePool += amount; if (bitHypePool >= parseInt(document.getElementById('cfg-bit-goal').value)) { armArena(); } else { renderLockedStatus(); } }

        function initTwitch() {
            const channel = document.getElementById('cfg-channel').value.trim().toLowerCase();
            if(!channel) return;

            if(twitchClient) { try { twitchClient.disconnect(); } catch(e){} }

            if (typeof tmi === 'undefined') {
                document.getElementById('conn-status').innerText = "tmi.js FAILED TO LOAD";
                document.getElementById('conn-status').style.color = "#ff0055";
                console.error("tmi.js library did not load - check network access to cdn.jsdelivr.net");
                return;
            }

            document.getElementById('conn-status').innerText = "CONNECTING...";
            document.getElementById('conn-status').style.color = "#ffea00";

            twitchClient = new tmi.Client({
                connection: { reconnect: true, secure: true },
                channels: [channel]
            });

            twitchClient.connect().then(() => {
                document.getElementById('conn-status').innerText = "LIVE TO " + channel.toUpperCase();
                document.getElementById('conn-status').style.color = "#00ff66";
            }).catch((err) => {
                document.getElementById('conn-status').innerText = "CONNECTION FAILED";
                document.getElementById('conn-status').style.color = "#ff0055";
                console.error("Twitch connection failed:", err);
            });

            twitchClient.on('message', (ch, tags, message, self) => {
                const rawMsg = message.trim();
                const msg = rawMsg.toLowerCase(), cmdLeft = document.getElementById('cfg-left-cmd').value.toLowerCase(), cmdRight = document.getElementById('cfg-right-cmd').value.toLowerCase();

                // Mod/broadcaster-only: !setbattle GenreName GenreName (use underscores for spaces in a name; vote commands auto-generate)
                if (msg.startsWith('!setbattle ')) {
                    const isAuthorized = tags.mod || (tags.badges && tags.badges.broadcaster === '1') || tags.username === channel;
                    if (isAuthorized && !isEventActive) {
                        const parts = rawMsg.split(' ').slice(1).filter(p => p.length > 0);
                        if (parts.length === 2) {
                            const wasArmed = arenaArmed;
                            const leftName = parts[0].replace(/_/g, ' ');
                            const rightName = parts[1].replace(/_/g, ' ');
                            const leftCmd = '!' + parts[0].toLowerCase().replace(/_/g, '');
                            const rightCmd = '!' + parts[1].toLowerCase().replace(/_/g, '');

                            document.getElementById('cfg-left-name').value = leftName;
                            document.getElementById('cfg-left-cmd').value = leftCmd;
                            document.getElementById('cfg-right-name').value = rightName;
                            document.getElementById('cfg-right-cmd').value = rightCmd;
                            applySetupChanges();

                            const who = tags['display-name'] || tags.username;
                            if (wasArmed) {
                                clearInterval(pollTimer); pollActive = false;
                                startEvent();
                            } else {
                                document.getElementById('status-line').innerHTML = `✅ Battle set by ${who}: <b>${leftName}</b> (${leftCmd}) vs <b>${rightName}</b> (${rightCmd})`;
                                setTimeout(() => { if (!isEventActive && !arenaArmed) renderLockedStatus(); }, 5000);
                            }
                        }
                    }
                    return;
                }

                // Genre vote poll: any viewer can vote by typing a pool genre name (one vote per user, changeable)
                if (pollActive) {
                    const matchedGenre = pollPool.find(g => g.toLowerCase() === msg);
                    if (matchedGenre) {
                        const genreKey = matchedGenre.toLowerCase();
                        const username = tags.username;
                        const prevVote = pollVoters[username];
                        if (prevVote !== genreKey) {
                            if (prevVote) pollVotes[prevVote] = Math.max(0, (pollVotes[prevVote] || 0) - 1);
                            pollVoters[username] = genreKey;
                            pollVotes[genreKey] = (pollVotes[genreKey] || 0) + 1;
                            updatePollStatus();
                        }
                    }
                    return;
                }

                if (isEventActive) {
                    if (msg === cmdLeft || msg === cmdRight) {
                        const username = tags.username; const currentTime = Date.now();
                        if (userCooldowns[username] && (currentTime - userCooldowns[username] < 3000)) return;
                        userCooldowns[username] = currentTime;
                        if (msg === cmdLeft) shiftFader('left'); if (msg === cmdRight) shiftFader('right');
                    }
                }
                else if (tags.bits) { bitHypePool += parseInt(tags.bits); if (bitHypePool >= parseInt(document.getElementById('cfg-bit-goal').value)) armArena(); else renderLockedStatus(); }
            });
            twitchClient.on('subscription', () => { handleSubEvent(); });
            twitchClient.on('resub', () => { handleSubEvent(); });
            twitchClient.on('subgift', () => { handleSubEvent(); });
        }

        function handleSubEvent() {
            if (isEventActive || arenaArmed) return;
            subHypeCount++;
            if (subHypeCount >= parseInt(document.getElementById('cfg-sub-goal').value)) { armArena(); } else { renderLockedStatus(); }
        }
    </script>
</body>
</html>
